services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-diet-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: daily_diet
    volumes:
      - daily-diet-pgdata:/var/lib/postgresql/data
      # Creates the test database on first init (empty volume).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d daily_diet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  daily-diet-pgdata:
